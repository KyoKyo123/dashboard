# Supabase 무료 플랜은 7일 동안 활동이 없으면 프로젝트를 일시정지함.
# 매일 한 번 DB에 가벼운 읽기 요청을 보내서 "활동 있음" 상태를 유지.
# (키는 config.js에 있는 공개용 publishable 키를 그대로 읽어 씀 — 관리자 키 아님)
name: supabase-keepalive

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write           # 월 1회 저장소 활동 기록용 (GitHub이 60일 무활동 시 예약 실행을 끄는 것 방지)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 읽기 요청
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "key:\s*'\K[^']+" config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/schedule?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = "200"

      - name: 매월 1일 저장소 활동 기록
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive: $(date -u +%Y-%m)" && git push
          fi
